<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOYAESTHETICS — Growth & Automation Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0A0A0A;
    --card: #141414;
    --card2: #1C1C1C;
    --gold: #C9A84C;
    --gold-light: #E2C97E;
    --ivory: #F5F0E8;
    --muted: #888;
    --border: rgba(201,168,76,0.18);
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--black);
    color: var(--ivory);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 40px;
    background: linear-gradient(to bottom, rgba(10,10,10,0.97), transparent);
  }
  .nav-logo {
    font-family: 'Cormorant Garant', serif;
    font-size: 20px; letter-spacing: 0.18em;
    color: var(--ivory); text-decoration: none; text-transform: uppercase;
  }
  .nav-badge {
    font-size: 11px; letter-spacing: 0.1em; color: var(--gold);
    text-transform: uppercase;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 48px 90px;
    position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 80% at 70% 30%, rgba(201,168,76,0.07) 0%, transparent 70%),
      linear-gradient(160deg, #0f0f0f 0%, #0A0A0A 60%, #110d08 100%);
  }
  .hero-bg-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Cormorant Garant', serif;
    font-size: clamp(110px, 20vw, 260px);
    font-weight: 300; font-style: italic;
    color: rgba(201,168,76,0.04);
    white-space: nowrap; pointer-events: none;
    user-select: none;
  }
  .hero-tag {
    font-size: 11px; letter-spacing: 0.25em;
    color: var(--gold); text-transform: uppercase;
    margin-bottom: 22px;
  }
  .hero-title {
    font-family: 'Cormorant Garant', serif;
    font-size: clamp(46px, 7.5vw, 94px);
    font-weight: 300; line-height: 1.04;
    max-width: 700px;
  }
  .hero-title em { font-style: italic; color: var(--gold-light); }
  .hero-sub {
    margin-top: 22px; font-size: 16px; color: var(--muted);
    max-width: 440px; line-height: 1.75;
  }
  .hero-cta {
    margin-top: 44px; display: flex; gap: 16px; flex-wrap: wrap;
  }
  .btn-primary {
    background: var(--gold); color: var(--black);
    padding: 16px 36px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: none; cursor: pointer; border-radius: 2px;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--gold-light); }
  .btn-ghost {
    background: transparent; color: var(--ivory);
    padding: 16px 36px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 400;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: 1px solid rgba(245,240,232,0.2); cursor: pointer; border-radius: 2px;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

  /* SECTIONS */
  .section { padding: 110px 48px; }
  .section-tag {
    font-size: 11px; letter-spacing: 0.22em;
    color: var(--gold); text-transform: uppercase; margin-bottom: 18px;
  }
  .section-title {
    font-family: 'Cormorant Garant', serif;
    font-size: clamp(34px, 5.5vw, 62px);
    font-weight: 300; line-height: 1.1; max-width: 620px;
  }
  .section-title em { font-style: italic; color: var(--gold-light); }
  .section-body {
    margin-top: 18px; font-size: 15px; color: var(--muted);
    max-width: 520px; line-height: 1.75;
  }

  /* PROBLEM */
  .problem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 1px; background: var(--border);
    border: 1px solid var(--border);
    margin-top: 56px;
  }
  .problem-card {
    background: var(--card); padding: 36px 28px;
  }
  .problem-icon { font-size: 26px; margin-bottom: 16px; }
  .problem-title {
    font-family: 'Cormorant Garant', serif;
    font-size: 22px; font-weight: 400; margin-bottom: 10px;
  }
  .problem-desc { font-size: 14px; color: var(--muted); line-height: 1.75; }

  /* WEBSITE CONCEPT */
  .website-preview {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden;
    margin-top: 56px;
  }
  .browser-bar {
    background: #1e1e1e; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .browser-dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: #28c840; }
  .browser-url {
    flex: 1; background: #2a2a2a;
    border-radius: 4px; padding: 5px 12px;
    font-size: 11px; color: #888; font-family: monospace; text-align: center;
  }
  .site-hero-block {
    background: linear-gradient(135deg, #0f0d0a 0%, #1a1208 100%);
    padding: 56px 40px; text-align: center;
    border-bottom: 1px solid var(--border); position: relative; overflow: hidden;
  }
  .site-hero-block::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 50% 60% at 50% 50%, rgba(201,168,76,0.08), transparent);
  }
  .site-hero-tag { font-size: 10px; letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase; margin-bottom: 14px; position: relative; }
  .site-hero-h {
    font-family: 'Cormorant Garant', serif;
    font-size: clamp(30px, 4vw, 50px);
    font-weight: 300; font-style: italic;
    color: var(--ivory); margin-bottom: 16px;
    position: relative; line-height: 1.1;
  }
  .site-hero-p { font-size: 14px; color: var(--muted); position: relative; margin-bottom: 28px; }
  .site-book-btn {
    background: var(--gold); color: var(--black);
    padding: 13px 30px; border: none; cursor: pointer;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    font-family: 'DM Sans', sans-serif; font-weight: 500;
    border-radius: 2px; position: relative;
    transition: background 0.2s;
  }
  .site-book-btn:hover { background: var(--gold-light); }
  .site-collections {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px; background: var(--border);
  }
  .site-col-item {
    background: var(--card2); padding: 26px 18px; text-align: center;
  }
  .site-col-icon { font-size: 26px; margin-bottom: 10px; }
  .site-col-name {
    font-family: 'Cormorant Garant', serif;
    font-size: 16px; color: var(--ivory); margin-bottom: 5px;
  }
  .site-col-sub { font-size: 11px; color: var(--muted); }

  /* BOOKING MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    justify-content: center; align-items: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #111; border: 1px solid var(--border);
    border-radius: 6px; width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
    padding: 40px;
    position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none; color: var(--muted);
    font-size: 22px; cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: var(--ivory); }
  .modal-title {
    font-family: 'Cormorant Garant', serif;
    font-size: 30px; font-weight: 300; margin-bottom: 6px;
  }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 30px; }
  .form-field { margin-bottom: 18px; }
  .form-field label { display: block; font-size: 11px; letter-spacing: 0.15em; color: var(--gold); text-transform: uppercase; margin-bottom: 7px; }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; background: #1a1a1a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 2px; padding: 12px 14px;
    color: var(--ivory); font-family: 'DM Sans', sans-serif;
    font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--gold); }
  .form-field select option { background: #1a1a1a; }
  .form-field textarea { resize: vertical; min-height: 80px; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .modal-submit {
    width: 100%; background: var(--gold); color: var(--black);
    border: none; padding: 15px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
    border-radius: 2px; cursor: pointer; margin-top: 8px;
    transition: background 0.2s;
  }
  .modal-submit:hover { background: var(--gold-light); }
  .modal-success {
    text-align: center; padding: 20px 0;
  }
  .modal-success-icon { font-size: 48px; margin-bottom: 16px; }
  .modal-success-title {
    font-family: 'Cormorant Garant', serif;
    font-size: 28px; font-weight: 300; margin-bottom: 10px; color: var(--gold-light);
  }
  .modal-success-text { font-size: 14px; color: var(--muted); line-height: 1.7; }

  /* AI CHAT */
  .ai-layout {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 60px; align-items: start; margin-top: 56px;
  }
  .chat-window {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .chat-header {
    background: linear-gradient(135deg, #1a1208, #141414);
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .chat-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
  }
  .chat-name { font-size: 14px; font-weight: 500; }
  .chat-status { font-size: 11px; color: var(--gold); margin-top: 2px; }
  .chat-body {
    padding: 20px; height: 340px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  .chat-body::-webkit-scrollbar { width: 3px; }
  .chat-body::-webkit-scrollbar-thumb { background: var(--border); }
  .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 88%; }
  .msg.ai { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-bubble {
    padding: 10px 14px; border-radius: 12px;
    font-size: 14px; line-height: 1.6;
  }
  .msg.ai .msg-bubble {
    background: var(--card2); border: 1px solid var(--border);
    color: var(--ivory); border-bottom-left-radius: 3px;
  }
  .msg.user .msg-bubble {
    background: var(--gold); color: var(--black);
    border-bottom-right-radius: 3px; font-weight: 500;
  }
  .msg-icon {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--gold); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg.user .msg-icon { background: #333; }
  .chat-input-row {
    padding: 14px 16px;
    display: flex; gap: 10px; align-items: center;
    border-top: 1px solid var(--border);
  }
  .chat-input {
    flex: 1; background: #1a1a1a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 10px 16px;
    color: var(--ivory); font-family: 'DM Sans', sans-serif; font-size: 14px;
    outline: none;
  }
  .chat-input:focus { border-color: var(--border); }
  .chat-send {
    background: var(--gold); color: var(--black);
    border: none; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .chat-send:hover { background: var(--gold-light); }
  .ai-feature-list { margin-top: 28px; display: flex; flex-direction: column; gap: 20px; }
  .ai-feature { display: flex; gap: 16px; align-items: flex-start; }
  .ai-feature-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); margin-top: 8px; flex-shrink: 0; }
  .ai-feature-text { font-size: 15px; color: #bbb; line-height: 1.7; }
  .ai-feature-text strong { color: var(--ivory); font-weight: 500; }

  /* WHATSAPP */
  .wa-layout {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 60px; align-items: start; margin-top: 56px;
  }
  .wa-phone {
    background: #0f0f0f; border: 1px solid #2a2a2a;
    border-radius: 30px; padding: 16px;
    max-width: 310px; margin: 0 auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .wa-screen { background: #111b21; border-radius: 18px; overflow: hidden; }
  .wa-topbar {
    background: #202c33; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .wa-av {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--gold); display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500; color: var(--black);
  }
  .wa-name { font-size: 13px; font-weight: 500; }
  .wa-online { font-size: 10px; color: #8696a0; }
  .wa-messages { padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 220px; }
  .wa-msg {
    max-width: 82%; padding: 8px 12px;
    border-radius: 8px; font-size: 12px; line-height: 1.55;
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.4s, transform 0.4s;
  }
  .wa-msg.visible { opacity: 1; transform: translateY(0); }
  .wa-msg.from { background: #202c33; color: #e9edef; align-self: flex-start; border-top-left-radius: 2px; }
  .wa-msg.to { background: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 2px; }
  .wa-time { font-size: 9px; color: #8696a0; text-align: right; margin-top: 3px; }

  /* LEAD CAPTURE */
  .lead-form-wrap {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 4px; padding: 44px;
    margin-top: 56px; max-width: 580px;
  }
  .lead-title { font-family: 'Cormorant Garant', serif; font-size: 28px; font-weight: 300; margin-bottom: 6px; }
  .lead-sub { font-size: 13px; color: var(--muted); margin-bottom: 30px; }
  .lead-submit {
    width: 100%; background: var(--gold); color: var(--black);
    border: none; padding: 15px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
    border-radius: 2px; cursor: pointer; margin-top: 6px;
    transition: background 0.2s;
  }
  .lead-submit:hover { background: var(--gold-light); }
  .lead-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 12px; }

  /* FOLLOW UP */
  .email-preview {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 4px; margin-top: 56px; max-width: 600px; overflow: hidden;
  }
  .email-topbar {
    background: #1a1a1a; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .email-bar-label { font-size: 11px; color: var(--muted); }
  .email-body { padding: 34px; }
  .email-from { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .email-subject { font-size: 17px; font-weight: 500; margin-bottom: 24px; }
  .email-text { font-size: 14px; color: #bbb; line-height: 1.8; }
  .email-text .hl { color: var(--ivory); font-weight: 500; }
  .email-cta {
    display: inline-block; margin-top: 24px;
    background: var(--gold); color: var(--black);
    padding: 12px 26px; border-radius: 2px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer; border: none;
  }

  /* ANALYTICS */
  .analytics-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1px; background: var(--border); border: 1px solid var(--border);
    margin-top: 56px; margin-bottom: 40px;
  }
  .stat-card { background: var(--card); padding: 36px 24px; }
  .stat-num {
    font-family: 'Cormorant Garant', serif;
    font-size: 56px; font-weight: 300; color: var(--gold);
    line-height: 1; margin-bottom: 8px;
  }
  .stat-label { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .stat-delta { font-size: 12px; color: #4ade80; margin-top: 8px; }

  /* FINAL CTA */
  .final-cta {
    padding: 130px 48px; text-align: center;
    background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(201,168,76,0.06), transparent);
    border-top: 1px solid var(--border);
  }
  .final-title {
    font-family: 'Cormorant Garant', serif;
    font-size: clamp(38px, 5.5vw, 72px);
    font-weight: 300; line-height: 1.08; margin-bottom: 22px;
  }
  .final-title em { font-style: italic; color: var(--gold-light); }
  .final-sub { font-size: 15px; color: var(--muted); max-width: 480px; margin: 0 auto 44px; line-height: 1.75; }
  .final-sig { margin-top: 60px; font-size: 12px; color: var(--muted); letter-spacing: 0.12em; }

  /* DIVIDER */
  .divider { border: none; height: 1px; background: var(--border); margin: 0; }

  /* NAV DOTS */
  .nav-dots {
    position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 100;
  }
  .nav-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(201,168,76,0.25); cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .nav-dot.active { background: var(--gold); transform: scale(1.5); }

  /* TYPING */
  .typing-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.7s ease forwards; }
  .fade-up-2 { animation: fadeUp 0.7s 0.15s ease forwards; opacity: 0; }
  .fade-up-3 { animation: fadeUp 0.7s 0.3s ease forwards; opacity: 0; }

  @media (max-width: 800px) {
    .ai-layout, .wa-layout { grid-template-columns: 1fr; }
    .site-collections { grid-template-columns: repeat(2, 1fr); }
    .form-row-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    nav { padding: 16px 20px; }
    .hero { padding: 0 20px 60px; }
    .section, .final-cta { padding: 70px 20px; }
    .lead-form-wrap { padding: 28px 20px; }
    .modal-box { padding: 28px 20px; }
    .nav-dots { display: none; }
    .analytics-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- BOOKING MODAL -->
<div class="modal-overlay" id="bookingModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalContent">
      <div class="modal-title">Book a Consultation</div>
      <div class="modal-sub">Fill in your details and Joy will reach out within 24 hours.</div>
      <div class="form-row-2">
        <div class="form-field">
          <label>First Name</label>
          <input type="text" placeholder="Chiamaka">
        </div>
        <div class="form-field">
          <label>Last Name</label>
          <input type="text" placeholder="Okafor">
        </div>
      </div>
      <div class="form-row-2">
        <div class="form-field">
          <label>Phone</label>
          <input type="text" placeholder="+234 ···">
        </div>
        <div class="form-field">
          <label>Email</label>
          <input type="email" placeholder="you@email.com">
        </div>
      </div>
      <div class="form-fie
