<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOYAESTHETICS | Client Growth System</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0b0b0f,#151522);
color:#fff;
overflow-x:hidden;
}

/* SCREENS */
.screen{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:25px;
}
.active{display:flex;}

/* CARD */
.card{
background:rgba(255,255,255,0.06);
backdrop-filter: blur(12px);
padding:25px;
border-radius:16px;
width:90%;
max-width:450px;
box-shadow:0 0 60px rgba(0,0,0,0.5);
animation:fade .4s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

/* INPUTS */
input,textarea,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
outline:none;
background:#111;
color:#fff;
}

/* BUTTONS */
button{
padding:14px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:12px;
font-weight:bold;
transition:0.2s;
width:100%;
}

button:hover{transform:scale(1.03);}

.primary{background:#fff;color:#000;}
.dark{background:#222;color:#fff;}

/* ADMIN */
#admin{
position:fixed;
right:0;
top:0;
width:320px;
height:100vh;
background:#0f0f15;
overflow:auto;
padding:15px;
display:none;
border-left:1px solid rgba(255,255,255,0.1);
}

.lead{
background:#1c1c28;
padding:10px;
margin-bottom:10px;
border-radius:8px;
font-size:12px;
}

.small{opacity:0.6;font-size:11px;}

/* NOTIFY */
#notify{
position:fixed;
bottom:20px;
right:20px;
background:#fff;
color:#000;
padding:12px;
border-radius:10px;
display:none;
font-size:12px;
max-width:260px;
}
</style>
</head>

<body>

<!-- LANDING -->
<div id="home" class="screen active">
<h1>JOYAESTHETICS SYSTEM</h1>
<p>Client acquisition & styling request automation system built for scaling fashion brands</p>
<button class="primary" onclick="go('form')">Open Client Request System</button>
</div>

<!-- FORM -->
<div id="form" class="screen">
<div class="card">
<h2>Client Styling Request</h2>

<textarea id="need" placeholder="What does the client need styled?"></textarea>
<input id="occasion" placeholder="Occasion (Wedding, Party, Corporate...)">
input id="budget" placeholder="Budget Range (₦ / $)">
<input id="style" placeholder="Style Preference">

<input id="name" placeholder="Client Name">
<input id="email" placeholder="Client Email">

<button class="primary" onclick="submitRequest()">Generate Styling Strategy</button>
</div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
<div class="card">
<h2>Styling Strategy Generated</h2>
<p id="output"></p>
<button class="primary" onclick="go('home')">Back Home</button>
</div>
</div>

<!-- ADMIN -->
<div id="admin"></div>

<!-- NOTIFY -->
<div id="notify"></div>

<script>

let data={};

function go(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* CORE STRATEGY ENGINE */
function generateStrategy(d){
return `
Client Styling Breakdown:

• Request: ${d.need}
• Occasion: ${d.occasion}
• Budget: ${d.budget}
• Style Direction: ${d.style}

Recommended Execution:
- Curate outfit based on emotional tone of client request
- Align styling with brand identity positioning
- Ensure visual confidence impact for client’s environment
- Prioritize fit, silhouette, and presence over trend

System Insight:
This client should be positioned as a "${d.style}" identity archetype.

Action:
Prepare curated outfit set + styling consultation follow-up.
`;
}

function submitRequest(){

data.need=document.getElementById("need").value;
data.occasion=document.getElementById("occasion").value;
data.budget=document.getElementById("budget").value;
data.style=document.getElementById("style").value;
data.name=document.getElementById("name").value;
data.email=document.getElementById("email").value;

if(!data.need || !data.name){
alert("Complete required fields");
return;
}

let result = generateStrategy(data);

/* SAVE */
let leads = JSON.parse(localStorage.getItem("leads")||"[]");
leads.push({...data,result,time:new Date().toLocaleString()});
localStorage.setItem("leads",JSON.stringify(leads));

document.getElementById("output").innerText = result;

notify("New styling request captured & logged into system");

loadAdmin();
go("result");
}

/* NOTIFY */
function notify(msg){
let n=document.getElementById("notify");
n.innerText=msg;
n.style.display="block";
setTimeout(()=>n.style.display="none",3000);
}

/* ADMIN (press A 5x) */
let tap=0;
document.addEventListener("keydown",(e)=>{
if(e.key==="a"){
tap++;
if(tap>=5){
document.getElementById("admin").style.display="block";
loadAdmin();
}
}
});

function loadAdmin(){
let leads=JSON.parse(localStorage.getItem("leads")||"[]");
let box=document.getElementById("admin");
box.innerHTML="<h3>Client Pipeline</h3>";

leads.reverse().forEach(l=>{
box.innerHTML+=`
<div class="lead">
<b>${l.name}</b><br>
${l.email}<br><br>
${l.need}<br><br>
<div class="small">${l.result}</div>
<small>${l.time}</small>
</div>
`;
});
}

</script>

</body>
</html>
